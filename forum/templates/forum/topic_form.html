{% extends "accounts/base.html" %}
{% block title %}New topic{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3 class="mb-4">New topic in {{ forum.name }}</h3>
                <form method="post" enctype="multipart/form-data" novalidate>
                    {% csrf_token %}
                    {% include "forum/_form_fields.html" %}
                    <button type="submit" class="btn btn-success w-100">Create topic</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{% url 'forum:topic_list' forum.pk %}">Back to {{ forum.name }}</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
